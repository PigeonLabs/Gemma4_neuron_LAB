claim: feedback-status context changes query-time causal dependence on fixed remaining native MLP groups under a persistent lesion
not_claimed: [new_weights, new_physical_connections, privileged_introspection, formal_mediation, new_algorithm]
scope: collaborator-reviewed design with CPU examples; no selected or qualified model lesions yet
task:
  name: supplied_nonce_table_composition_and_direct_lookup
  X_keys: 16
  Y_keys: 16
  Z_values: 4
  training_queries: 8
  held_out_queries: 8
  reply_codes: ABCD
  codebook: independently permuted per query; correct-code and semantic-answer counts balanced
  witnesses: [direct_only, composition_only, dual_route, code_map_only]
  conflict_probes: separate diagnostic without an accuracy oracle; not proof of a full internal algorithm
history:
  names: [A, B, demo, Aperm, Bperm]
  source_lesions: [A, B]
  mode: sequential_reference_corrected_diagnostic_records
  visible: input plus evaluator-provided oracle reference plus status 0/1/2
  private: actual source predictions and source mask identity
  demo_status: '2'
  source_prediction: constrained argmax among four verified single-token codes
  permutation: within trial positions 0-3 and 4-7 only; no task/route/error-predictive strata
  identity_permutation: retained and counted
  no_test_feedback: true
  reset_between_episodes: true
  information_scope: error-profile-conditioned computation; externally available feedback, not privileged access
execution_contract:
  one_gpu_process: true
  frozen_parameters: true
  use_cache: false
  actual_forward_definition: one full-prefix forward per constrained decision; no separate prefix prefill or extra decoder token
  unrestricted_top1: record separately; not conflated with constrained four-way accuracy
  primary_mask: persistent zero at every token of every full forward
  secondary_mask: query segment including frozen chat-template boundary only
  readout_order: final_RMSNorm_then_tied_LM_head_then_tanh_softcap_30
  primary_margin: post_softcap_correct_logit_minus_logsumexp_three_other_codes
  raw_LM_head_values: diagnostic_only
  max_input_tokens: 1000
  cached_config_sliding_window: 1024
  cached_config_layer_pattern: five_sliding_then_one_full_attention
  future_cache_optimization: requires separate lesion/history/dtype/template/boundary-tagged cache parity qualification
selection:
  split: discovery_only
  layer_pool: [15, 22, 26, 35]
  group_sizes: [32, 128]
  primary_candidate_count: 16
  recruited_candidate_count: 8
  primary_lesions: null
  recruited_groups: null
  old_four_coordinates: descriptive_history_only
  no_reselection_after_calibration: true
  error_profile: discovery-fixed visible table-position feature and sign; calibrated error AUC >= .70
  recruited_groups_disjoint_from_both_lesions: true
  group_pair: same layer and size where feasible; no automatic equal-energy interpretation
lesion_eligibility:
  healthy_constrained_accuracy_min: .90
  dual_route_accuracy_loss_point_min: .20
  paired_95CI_damage_lower_min: .10
  opposite_route_witness_damage_difference_min: .15
  opposite_error_profiles: true
  code_map_only_accuracy_loss_max: .05
  off_target_gate_is_equivalence_claim: false
  lesion_pair_damage_difference_max: .10
  failure: NOT_IDENTIFIABLE_under_the_bounded_search
control_panel:
  random_seeds: [5111, 5129, 5147]
  panels: one fixed three-group panel per physical primary lesion
  identity_selection: discovery_only
  calibration: global attenuation using local postnorm residual geometry before suffix outcomes; no query-wise retuning
  local_L2_matching_relative_tolerance: .20
  maximum_unmatched_query_fraction: .20
  confirmation_Fisher_displacement: diagnostic_only_never_control_selection
  unavailable_matching: mechanism_geometry_NOT_IDENTIFIABLE; retain full behavioral results
norm_replay:
  confirmation_episode_indices: [0, 1, 2, 3, 4, 5, 6, 7]
  contexts: [A_A, A_demo, A_B, B_B, B_demo, B_A]
  arms: [baseline, RA, RB, G1, G2, G3]
  denominator_reference: same_L_and_H_L-only_baseline
  scope: all inventoried RMSNorm sites at or after earliest selected R layer plus terminal norm, query positions only
  architecture_implementation: NOT_IMPLEMENTED
  replay_parity_required: true
  interpretation: bounded sensitivity analysis in a modified compute graph; not elimination of all normalization or nonlinear alternatives
estimands:
  behavioral_recovery: mean_L_accuracy(L,H_L)-accuracy(L,H_demo)
  behavioral_truth: mean_L_accuracy(L,H_L)-accuracy(L,H_Lperm)
  behavioral_crossover: .5*((accuracy(A,A)-accuracy(A,B))+(accuracy(B,B)-accuracy(B,A)))
  second_damage: D(L,H,G)=Y(L,H,none)-Y(L,H,G)
  mechanism_primary: mean_L((D(L,H_L,R_L)-D(L,H_demo,R_L))-mean_random(D(L,H_L,G)-D(L,H_demo,G)))
  mechanism_required_support: [own_vs_cross_history_interaction, RA_RB_double_dissociation, geometry_support]
  statistical_unit: independent_episode; average held-out queries within episode before uncertainty estimation
  confirmation_episodes: 48
  behavioral_practical_point_threshold: .08
  mechanism_SESOI_rule: max(.05 nats, 5 times calibration technical replay floor); frozen before confirmation
  CI: episode-level paired bootstrap, 10000 resamples, seed 51991
  gatekeeping: recovery_then_truth_then_crossover_then_mechanism; fixed order, each alpha .05
  success: accuracy effects point >= .08 and positive CI; positive mechanism beyond frozen SESOI and all required support; no margin-only behavioral claim
  scoped_directional_rejection: one-sided upper CI below predeclared positive practical target
  equivalence: separate TOST or 90 percent CI inside preregistered practical bounds only
  power_scope: 48 episodes is a pilot-sized confirmation, not a guaranteed 80 percent powered study for an 8-point effect
  post_treatment_subset: prohibited_for_primary
