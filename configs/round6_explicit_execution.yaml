    contexts:
    - agreement
    - conflict_value_1
    - conflict_value_2
    physical_primary:
    - healthy
    - persistent_L
    secondary_arms:
    - none
    - R
    - random1
    - random2
    - random3
    authority: direct table h even when substitute composition table disagrees; never
      relabel after lesion
    primary: ((D_R(L,agreement)-D_R(healthy,agreement))-(D_R(L,conflict)-D_R(healthy,conflict)))-same_random_panel_contrast
    identity_test: natural donor replacement from conflict_value_2 into conflict_value_1
