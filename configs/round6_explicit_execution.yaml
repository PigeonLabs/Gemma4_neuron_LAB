    confirmation_max_base_calls: 8192
    calibration_max_base_calls: 2048
    additional_guards_and_norm_calls_cap: 1800
    no_primary: STOPPED_AT_PRIMARY_LESION_GATE
    no_backup: STOPPED_AT_BACKUP_QUALIFICATION
