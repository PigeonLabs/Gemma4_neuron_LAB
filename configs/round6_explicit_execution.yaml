    max_actual_forward_calls: 17500
    discovery_cap: 2000
    direct_shortcut: absent
    receiver_functions:
    - g0
    - g1
    distinguishing_values: recipient original answer a, counterfactual g0(y_donor)=b,
      donor final answer c, counterfactual g1(y_donor)=d, all distinct
    source_worlds:
    - recipient
    - intermediate_donor
    - same_intermediate_other_g_donor
    - semantic_sham
    - independent_correct_intermediate_rescue
    - independent_wrong_intermediate_rescue
    primary: increase in logit(receiver_g(y_donor))-logit(donor_final) minus sham
      and the same fixed-random contrast, averaged across both receiver functions
    evaluation_arms:
    - G_intermediate
    - G_same_intermediate_other_g
    - G_sham
    - G_zero_query
    - independent_rescue_correct
    - independent_rescue_wrong
    - random1_intermediate
    - random1_sham
    - random1_zero
    - random2_intermediate
    - random2_sham
    - random2_zero
    - random3_intermediate
    - random3_sham
    - random3_zero
    - whole_site_reference
    discovery_gate: measurable composition plus native group with receiver-counterfactual
      specificity >= .10 nats and corresponding choice increase >= .10, necessity
      and code guard
    calibration_gate: same group in fresh functions, positive specificity/necessity/independent
      rescue and geometry/code guards; no reselection
    confirmation_max_base_calls: 11264
    calibration_max_base_calls: 2816
    additional_code_guards_and_norm_calls_cap: 1000
    no_qualified_group: STOPPED_AT_DISCOVERY_INTERMEDIATE_GATE
