calibration_order: Deterministic round robin over sorted (anchor_kind,world) groups,
  preserving each within-group order; complex sentinels round robin over worlds.
A_order_anchor_repair: Ask about DIRECT announcement before action, explicitly excluding
  inference through a signal. Main hypotheses unchanged; old measured R10 preserved.
measurement_scope: Final selected option under this direct-output instruction and
  256-token budget; not equivalent to R9/R10 behavior and no randomized causal estimate
  of wording improvement.
no_further_repair: After a question fails this R10b calibration, do not increase cap,
  retry failed answers, change prompt, or create R10c; continue other independent
  questions.
prompt_independence: Each case uses a fresh one-user-message template and no conversation
  history; generation KV cache is created separately for each call, never carried
  between anchors/main.
