hypothesis: native MLP random-subset sensitivity predicts unseen native-attention
  and residual perturbation sensitivity prospectively beyond clean task/margin/length/site
  norms/readout-only sensitivity
intervention: four fixed seeds per family; layer23 last token; native MLP/attention
  1024 fixed random coordinates attenuated .5; residual isotropic .02 clean-relative
  norm; no target-output dose matching
prediction: ridge lambda1 fitted on six independent calibration worlds; frozen before
  P0; each P0 source reaction then predictions saved before that case target forwards;
  no P0 refit
primary: mean normalized heldout MSE reduction across two target families, with world-cluster
  CI; both task means positive and exceeds within-task+codebook source-shuffle 95th
Positive: primary CI lower>.02 and both tasks point positive and source matching negative-control
  passed
Negative: primary CI upper<.02
readout_control: clean final decoder state -> actual final norm -> selected tied head
  rows -> actual softcap, parity qualified; eight isotropic local probes; no extra
  model forward
failure: calibration task/effect envelope, readout parity, or P0 task/code readiness
  -> Inconclusive/NOT_IDENTIFIABLE; never increase dose after output
interpretation: predictive input property only; cannot establish common causal bottleneck;
  actual target delivery geometry not a predictor
