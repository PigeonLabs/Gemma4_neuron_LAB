[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4-neuron-lab"
version = "0.1.0"
description = "Bounded reproducible BF16 Gemma 4 native MLP neuron research"
requires-python = ">=3.12"
dependencies = ["torch>=2.7", "transformers==5.21.0", "accelerate>=1.0", "numpy>=2", "pyarrow>=20", "matplotlib>=3.9", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
explorer = ["streamlit>=1.40"]

[project.scripts]
neuron-lab = "neuron_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
